exclude: |
  (?x)^(
      scripts/|
      assets/|
      vlmeval/config.py |
      vlmeval/dataset/utils/wemath.py |
      vlmeval/dataset/OmniDocBench/ |
      vlmeval/dataset/utils/megabench/ |
      vlmeval/dataset/utils/vgrpbench/ |
      vlmeval/dataset/utils/chartmimic/ |
      vlmeval/vlm/ola/ |
      vlmeval/vlm/ursa/ |
      vlmeval/vlm/ovis/ |
      vlmeval/dataset/utils/mme_reasoning.py
  )
repos:
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args:
          [
            "--max-line-length=120",
            "--ignore=F401,F403,F405,E402,E722,E741,W503,E231,E702",
          ]
        # This fork intentionally keeps historical replay/provenance entrypoints
        # needed to reproduce the final table. Many of those files were copied
        # from dirty experiment worktrees and are not style-normalized; keep
        # them tracked, but do not block publishing on legacy formatting.
        exclude: |
          (?x)^(
              configs/|
              scripts_legacy/|
              vlmeval/api/(gpt|ori_gpt_client)\.py|
              vlmeval/cross_image_flow\.py|
              vlmeval/dataset/(__init__|dynamath|image_mcq|image_vqa)\.py|
              vlmeval/dataset/utils/(judge_util|logicvista|visulogic)\.py|
              vlmeval/inference\.py|
              vlmeval/vlm/__init__\.py|
              vlmeval/vlm/(dual_thinker.*|duplex.*|jointmodel|vllm_jointmodel.*|single_thinker.*)\.py|
              vlmeval/vlm/(modeling_qwen_custom_vl_hw|modeling_llava_baseline)\.py|
              vlmeval/vlm/(qwen25vl_custom.*|qwen2_5_vl_custom|qwen_gpt_vl|qwen35_vl_replay)\.py|
              vlmeval/vlm/(gemma4_replay|minicpm_v_4_5_replay|replay_image_transform|replay_policy)\.py|
              vlmeval/vlm/qwen2_vl/model\.py|
              vlmeval/vlm/duplexpts2/
          )
  - repo: https://github.com/google/yapf
    rev: v0.43.0
    hooks:
      - id: yapf
        args: ["--style={column_limit=120}"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

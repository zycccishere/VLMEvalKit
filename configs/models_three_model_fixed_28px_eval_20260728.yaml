env_profiles:
  qwen_eval:
    python: /user/wanzihao/miniconda3/envs/vlmevalkit/bin/python
    pythonpath:
      - "{repo_root}"
    base_env:
      LMUData: "{lmu_data}"
      FORCE_LOCAL: "True"
      OLD_VERSION: "False"
      PYTHONNOUSERSITE: "1"
      VLMEVAL_API_MINIMAL_IMPORT: "1"
      VLMEVAL_VLM_MINIMAL_IMPORT: "1"
      VLMEVAL_LAZY_INIT: "1"
      REPLAY_IMAGE_TRANSFORM_STRICT: "1"
      REPLAY_IMAGE_TRANSFORM_MODEL_FAMILY: qwen2_5_vl
  minicpm_eval:
    python: /user/zhangyicheng/miniconda3/envs/vlmeval_qwen35_vllm/bin/python
    pythonpath:
      - "{repo_root}"
    base_env:
      LMUData: "{lmu_data}"
      FORCE_LOCAL: "True"
      OLD_VERSION: "False"
      PYTHONNOUSERSITE: "1"
      VLMEVAL_USE_MINICPM45_MINIMAL_CONFIG: "1"
      VLMEVAL_API_MINIMAL_IMPORT: "1"
      VLMEVAL_VLM_MINIMAL_IMPORT: "1"
      VLMEVAL_LAZY_INIT: "1"
      REPLAY_IMAGE_TRANSFORM_STRICT: "1"
      REPLAY_IMAGE_TRANSFORM_MODEL_FAMILY: minicpm45
models:
  qwen25vl_3b:
    display_name: Qwen2.5-VL-3B fixed 28px posthoc eval
    registry_name: Qwen2.5-VL-3B-Instruct-Replay
    env_profile: qwen_eval
    model_path: "{model_root}/Qwen2.5-VL-3B-Instruct"
    runtime:
      gpus_per_job: 1
      infer_batch_size: 64
      max_num_seqs: 64
      tp_size: 1
      max_model_len: 32768
      estimated_dataset_cost: 1.0
    task_env:
      VLMEVAL_USE_QWEN_MINIMAL_CONFIG: "1"
      MODEL_PATH_QWEN25_3B: "{model_root}/Qwen2.5-VL-3B-Instruct"
  qwen25vl_32b:
    display_name: Qwen2.5-VL-32B fixed 28px posthoc eval
    registry_name: Qwen2VLChatReplay
    env_profile: qwen_eval
    model_path: "{model_root}/Qwen2.5-VL-32B-Instruct"
    runtime:
      gpus_per_job: 1
      infer_batch_size: 16
      max_num_seqs: 16
      tp_size: 1
      max_model_len: 32768
      estimated_dataset_cost: 1.0
    task_env:
      VLMEVAL_USE_QWEN_MINIMAL_CONFIG: "1"
      MODEL_PATH_QWEN25_32B: "{model_root}/Qwen2.5-VL-32B-Instruct"
  minicpm_o_45:
    display_name: MiniCPM-o-4.5 fixed 28px posthoc eval
    registry_name: MiniCPM-o-4_5-Replay
    env_profile: minicpm_eval
    model_path: "{model_root}/MiniCPM-o-4_5"
    runtime:
      gpus_per_job: 1
      infer_batch_size: 64
      max_num_seqs: 64
      tp_size: 1
      max_model_len: 32768
      estimated_dataset_cost: 1.0
    task_env:
      VLMEVAL_USE_MINICPM45_MINIMAL_CONFIG: "1"
      MODEL_PATH_MINICPMO45: "{model_root}/MiniCPM-o-4_5"

name: gemma3_12b_iqiq_image2_shift_fixed_posthoc_eval_20260630
repo_root: "{repo_root}"
results_root: runs/gemma3_12b_iqiq_image2_shift_fixed_20260629
node_gpu_ids: "0,1,2,3,4,5,6,7"
scheduler: gpu_pool
datasets:
  - MathVision
  - DynaMath
  - LogicVista
  - VisualPuzzles
  - AI2D_TEST
  - OCRBench
  - SEEDBench2_Plus
policies:
  default:
    replay_prompt_template_name: identity
replay_modes:
  - image_text_image_text
image_transforms:
  - baseline
  - shift_down_half_vit_token
  - shift_down_one_vit_token
  - shift_down_one_llm_token
  - shift_right_half_vit_token
  - shift_right_one_vit_token
  - shift_right_one_llm_token
models:
  - gemma3_12b
replay:
  replay_times: 1
  template_on_last_replay_text: 1
  image_copy_mode: reuse_path
  limit_mm_per_prompt: 2
  safe_fallback: 0
  safe_truncate_chars: 6000
  strict_batch: 1
  stage_debug: 1
  stage_debug_samples: 1
  prompt_audit: 1
  prompt_audit_print: 0
  image_transform_strict: 1
trace:
  level: summary
  samples: 2
  dump_max_chars: 12000
  prompt_audit_print: 0
  processor_validate: 1
  processor_save_npz: 0
answer_format:
  enable: 1
  require_boxed: 0
  response_col: prediction
  fallback_col: detailed_prediction
  max_fails: 50
evaluation:
  launch_mode: fg
  nproc: 4
  judge: gpt-4o-mini
worker_monitor:
  enable: true
  interval_seconds: 300
resume_infer_default: true
resume_infer_start_delay_seconds: 0

name: minicpmo45_iqiq_image2_nominal_query_pitch_infer_20260719
repo_root: "{repo_root}"
results_root: runs/minicpmo45_iqiq_image2_nominal_query_pitch_20260719
node_gpu_ids: "0,1,2,3,4,5,6,7"
scheduler: gpu_pool
datasets:
  - MathVision
  - DynaMath
  - LogicVista
  - VisualPuzzles
  - AI2D_TEST
  - OCRBench
  - SEEDBench2_Plus
policies:
  default:
    replay_prompt_template_name: identity
replay_modes:
  - image_text_image_text
image_transforms:
  - shift_down_one_llm_token
  - shift_up_one_llm_token
  - shift_right_one_llm_token
  - shift_left_one_llm_token
models:
  - minicpm_o_45
replay:
  replay_times: 1
  template_on_last_replay_text: 1
  image_copy_mode: reuse_path
  limit_mm_per_prompt: 2
  safe_fallback: 0
  safe_truncate_chars: 6000
  strict_batch: 1
  stage_debug: 1
  stage_debug_samples: 2
  prompt_audit: 1
  prompt_audit_print: 0
  image_transform_strict: 1
trace:
  level: summary
  samples: 2
  dump_max_chars: 16000
  prompt_audit_print: 0
answer_format:
  enable: 0
  require_boxed: 0
  response_col: prediction
  fallback_col: detailed_prediction
  max_fails: 50
evaluation:
  launch_mode: skip
  nproc: 8
  judge: gpt-4o-mini
worker_monitor:
  enable: true
  interval_seconds: 300
resume_infer_default: true
resume_infer_start_delay_seconds: 0

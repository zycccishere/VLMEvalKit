env_profiles:
  main_vlmeval:
    python: "{conda_root}/envs/vlmevalkit/bin/python"
    pythonpath:
      - "{repo_root}"
    base_env:
      HF_ENDPOINT: https://hf-mirror.com
      HUGGINGFACE_HUB_ENDPOINT: https://hf-mirror.com
      OMP_NUM_THREADS: "1"
      FORCE_LOCAL: "True"
      OLD_VERSION: "False"
      PYTHONNOUSERSITE: "1"
  minicpm45_vllm:
    python: "{conda_root}/envs/vlmeval_minicpm45_vllm/bin/python"
    pythonpath:
      - "{repo_root}"
    ensure_modules:
      - librosa
    base_env:
      HF_ENDPOINT: https://hf-mirror.com
      HUGGINGFACE_HUB_ENDPOINT: https://hf-mirror.com
      OMP_NUM_THREADS: "1"
      FORCE_LOCAL: "True"
      OLD_VERSION: "False"
      PYTHONNOUSERSITE: "1"
      VLMEVAL_USE_MINICPM45_MINIMAL_CONFIG: "1"
      VLMEVAL_API_MINIMAL_IMPORT: "1"
      VLMEVAL_VLM_MINIMAL_IMPORT: "1"
      VLMEVAL_LAZY_INIT: "1"
      MINICPM45_USE_VLLM: "1"

models:
  qwen25vl_3b:
    display_name: Qwen2.5-VL-3B-Instruct
    registry_name: Qwen2VLChatReplay
    env_profile: main_vlmeval
    model_path: "{model_root}/Qwen2.5-VL-3B-Instruct"
    runtime:
      gpus_per_job: 1
      infer_batch_size: 64
      max_num_seqs: 64
      tp_size: 1
      max_model_len: 32768
      estimated_dataset_cost: 0.8
    task_env:
      MODEL_PATH: "{model_root}/Qwen2.5-VL-3B-Instruct"
      MODEL_PATH_QWEN25: "{model_root}/Qwen2.5-VL-3B-Instruct"

  qwen25vl_7b:

env_profiles:
  main_vlmeval:
    python: "{conda_root}/envs/vlmevalkit/bin/python"
    pythonpath:
      - "{repo_root}"
    base_env:
      LMUData: "{lmu_data}"
      HF_ENDPOINT: https://hf-mirror.com
      OMP_NUM_THREADS: "1"
      FORCE_LOCAL: "True"
      OLD_VERSION: "False"
      PYTHONNOUSERSITE: "1"
      VLMEVAL_API_MINIMAL_IMPORT: "1"
      VLMEVAL_VLM_MINIMAL_IMPORT: "1"
      VLMEVAL_LAZY_INIT: "1"
  qwen35_vllm:
    python: "{conda_root}/envs/vlmeval_qwen35_vllm/bin/python"
    pythonpath:
      - "{repo_root}"
    base_env:
      LMUData: "{lmu_data}"
      HF_ENDPOINT: https://hf-mirror.com
      OMP_NUM_THREADS: "1"
      FORCE_LOCAL: "True"
      OLD_VERSION: "False"
      PYTHONNOUSERSITE: "1"
      VLMEVAL_USE_QWEN_MINIMAL_CONFIG: "1"
      VLMEVAL_API_MINIMAL_IMPORT: "1"
      VLMEVAL_VLM_MINIMAL_IMPORT: "1"
      VLMEVAL_LAZY_INIT: "1"
      QWEN35_USE_VLLM: "1"
  minicpm45_vllm:
    python: "{conda_root}/envs/vlmeval_qwen35_vllm/bin/python"
    pythonpath:
      - "{repo_root}"
    ensure_modules:
      - librosa
    base_env:
      LMUData: "{lmu_data}"
      HF_ENDPOINT: https://hf-mirror.com
      OMP_NUM_THREADS: "1"
      FORCE_LOCAL: "True"
      OLD_VERSION: "False"
      PYTHONNOUSERSITE: "1"
      VLMEVAL_USE_MINICPM45_MINIMAL_CONFIG: "1"
      VLMEVAL_API_MINIMAL_IMPORT: "1"
      VLMEVAL_VLM_MINIMAL_IMPORT: "1"
      VLMEVAL_LAZY_INIT: "1"
      MINICPM45_USE_VLLM: "1"
  gemma3_vllm:
    python: "{conda_root}/envs/vlmeval_gemma4_vllm/bin/python"
    pythonpath:
      - "{repo_root}"
    base_env:
      LMUData: "{lmu_data}"
      HF_ENDPOINT: https://hf-mirror.com
      OMP_NUM_THREADS: "1"
      FORCE_LOCAL: "True"
      OLD_VERSION: "False"
      PYTHONNOUSERSITE: "1"
      VLMEVAL_USE_GEMMA3_MINIMAL_CONFIG: "1"
      VLMEVAL_API_MINIMAL_IMPORT: "1"
      VLMEVAL_VLM_MINIMAL_IMPORT: "1"
      VLMEVAL_LAZY_INIT: "1"
      GEMMA3_USE_VLLM: "1"
  gemma4_vllm:
    python: "{conda_root}/envs/vlmeval_gemma4_vllm/bin/python"
    pythonpath:
      - "{repo_root}"
    base_env:
      LMUData: "{lmu_data}"
      HF_ENDPOINT: https://hf-mirror.com
      OMP_NUM_THREADS: "1"
      FORCE_LOCAL: "True"
      OLD_VERSION: "False"
      PYTHONNOUSERSITE: "1"
      VLMEVAL_USE_GEMMA4_MINIMAL_CONFIG: "1"
      VLMEVAL_API_MINIMAL_IMPORT: "1"
      VLMEVAL_VLM_MINIMAL_IMPORT: "1"
      VLMEVAL_LAZY_INIT: "1"
      GEMMA4_USE_VLLM: "1"
      GEMMA4_ENABLE_THINKING: "0"

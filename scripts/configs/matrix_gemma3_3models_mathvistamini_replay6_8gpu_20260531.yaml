name: gemma3_3models_mathvistamini_replay6_8gpu_20260531
repo_root: "{repo_root}"
results_root: runs/gemma3_3models_mathvistamini_replay6_8gpu_20260531
node_gpu_ids: "0,1,2,3,4,5,6,7"
scheduler: gpu_pool
datasets:
  - MathVista_MINI
policies:
  default:
    replay_prompt_template_name: identity
replay_modes:
  - image_text
  - text_image
  - image_image_text
  - image_text_image
  - image_text_text
  - image_text_image_text
image_transforms:
  - baseline
models:
  - gemma3_27b
  - gemma3_12b
  - gemma3_4b
replay:
  replay_times: 1
  template_on_last_replay_text: 1
  image_copy_mode: reuse_path
  limit_mm_per_prompt: 2
  safe_fallback: 0
  safe_truncate_chars: 6000
  strict_batch: 1
  stage_debug: 1
  stage_debug_samples: 1
  prompt_audit: 1
  prompt_audit_print: 0
trace:
  level: summary
  samples: 1
  dump_max_chars: 12000
  prompt_audit_print: 0
answer_format:
  enable: 1
  require_boxed: 0
  response_col: prediction
  fallback_col: detailed_prediction
  max_fails: 50
evaluation:
  launch_mode: fg
  nproc: 8
  judge: gpt-4o-mini
worker_monitor:
  enable: true
  interval_seconds: 600
resume_infer_default: false
resume_infer_start_delay_seconds: 10

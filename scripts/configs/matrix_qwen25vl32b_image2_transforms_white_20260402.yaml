name: qwen25vl32b_image2_transforms_white_20260402
repo_root: "{repo_root}"
results_root: runs/by_setting_qwen25vl32b_image2_transforms_white_20260402
node_gpu_ids: "0,1,2,3,4,5,6,7"
datasets:
  - AI2D_TEST
  - OCRBench
  - LogicVista
  - VisualPuzzles
  - DynaMath
policies:
  default:
    replay_prompt_template_name: identity
replay_modes:
  - image_text_image
image_transforms:
  - baseline
  - mask10_white
  - mask20_white
  - blank
  - random_same_dataset
  - rotate180
  - shift_right_halfpatch_wrap
  - shift_right_onepatch_wrap
  - shift_down_halfpatch_wrap
  - shift_down_onepatch_wrap
  - zoom_1p5_uncropped
models:
  - qwen25vl_32b
replay:
  replay_times: 1
  template_on_last_replay_text: 1
  image_copy_mode: reuse_path
  limit_mm_per_prompt: 2
  safe_fallback: 0
  safe_truncate_chars: 6000
  stage_debug: 1
  stage_debug_samples: 1
  prompt_audit: 1
  prompt_audit_print: 0
trace:
  level: summary
  samples: 1
  dump_max_chars: 12000
  prompt_audit_print: 0
answer_format:
  enable: 1
  require_boxed: 0
  response_col: prediction
  fallback_col: detailed_prediction
  max_fails: 50
evaluation:
  launch_mode: fg
  nproc: 8
  judge: gpt-4o-mini
  openai_api_key: ""
  openai_api_base: https://api.openai.com/v1
worker_monitor:
  enable: true
  interval_seconds: 600
resume_infer_default: false

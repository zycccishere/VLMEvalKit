name: api_replay_standard
repo_root: "{repo_root}"
results_root: runs/by_setting_api_replay_standard
node_gpu_ids: "0,1,2,3,4,5,6,7"
datasets:
  - DynaMath
  - MathVision
  - LogicVista
  - VisualPuzzles
  - MMMU_DEV_VAL_SINGLE_IMAGE
  - MathVista_MINI
  - WeMath
  - AI2D_TEST
  - OCRBench
  - SEEDBench2_Plus
  - MMBench_DEV_EN_V11
  - MMStar
policies:
  direct:
    replay_prompt_template_name: directly_answer
  default:
    replay_prompt_template_name: identity
replay_modes:
  - image_text
  - text_image
  - image_text_text
  - image_image_text
  - image_text_image
  - image_text_image_text
models:
  - gpt4o_mini
  - gpt_4o_mini
  - gpt_5_mini
  - gpt_5_2025_08_07
  - gpt_5_chat
  - claude_haiku_4_5_20251001
  - gemini_25_flash_lite
  - gemini_25_flash_nothinking
  - gemini_25_flash_thinking
  - gemini_3_flash_preview_nothinking
  - gemini_31_flash_lite
replay:
  replay_times: 1
  template_on_last_replay_text: 1
  image_copy_mode: reuse_path
  limit_mm_per_prompt: 2
  safe_fallback: 0
  safe_truncate_chars: 6000
  stage_debug: 1
  stage_debug_samples: 8
  prompt_audit: 1
  prompt_audit_print: 1
answer_format:
  enable: 1
  require_boxed: 0
  response_col: prediction
  fallback_col: detailed_prediction
  max_fails: 50
evaluation:
  launch_mode: fg
  nproc: 8
  judge: gpt-4o
  openai_api_key: ""
  openai_api_base: https://api.openai.com/v1
worker_monitor:
  enable: true
  interval_seconds: 600
resume_infer_default: false

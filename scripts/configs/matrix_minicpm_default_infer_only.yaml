name: replay6_minicpm_default_infer_only
repo_root: "{repo_root}"
results_root: runs/by_setting
node_gpu_ids: "0,1,2,3,4,5,6,7"
datasets:
  - AI2D_TEST
  - MathVista_MINI
  - OCRBench
  - SEEDBench2_Plus
  - VisuLogic
  - LogicVista
  - VisualPuzzles
  - DynaMath
  - MathVision
policies:
  default:
    replay_prompt_template_name: identity
replay_modes:
  - image_text
  - text_image
  - image_text_text
  - image_text_image
  - image_text_image_text
  - image_image_text
models:
  - minicpm_v_45
  - minicpm_o_45
replay:
  replay_times: 1
  template_on_last_replay_text: 1
  image_copy_mode: reuse_path
  limit_mm_per_prompt: 2
  safe_fallback: 0
  safe_truncate_chars: 6000
  stage_debug: 1
  stage_debug_samples: 8
  prompt_audit: 1
  prompt_audit_print: 1
answer_format:
  enable: 1
  require_boxed: 0
  response_col: prediction
  fallback_col: detailed_prediction
  max_fails: 50
evaluation:
  launch_mode: skip
  nproc: 8
  judge: gpt-4o-mini
  openai_api_key: ""
  openai_api_base: https://api.openai.com/v1
worker_monitor:
  enable: true
  interval_seconds: 600
resume_infer_default: false

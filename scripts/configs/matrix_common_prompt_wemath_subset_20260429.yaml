name: common_prompt_wemath_subset_20260429
repo_root: "{repo_root}"
results_root: runs/common_prompt_wemath_subset_20260429
node_gpu_ids: "0,1,2,3,4,5,6,7"
scheduler: gpu_pool
datasets:
  - WeMath
dataset_index_allowlists:
  WeMath: "{repo_root}/scripts/configs/index_allowlists/wemath_first80_20260429.txt"
policies:
  default:
    replay_prompt_template_name: identity
replay_modes:
  - image_text
  - image_text_image
image_transforms:
  - baseline
models:
  - qwen25vl_7b
  - gemma3_12b
  - gemma3_27b
replay:
  replay_times: 1
  template_on_last_replay_text: 1
  force_common_prompt: 1
  image_copy_mode: reuse_path
  limit_mm_per_prompt: 2
  safe_fallback: 0
  safe_truncate_chars: 6000
  stage_debug: 1
  stage_debug_samples: 1
  prompt_audit: 1
  prompt_audit_print: 0
trace:
  level: summary
  samples: 1
  dump_max_chars: 12000
  prompt_audit_print: 0
answer_format:
  enable: 1
  require_boxed: 0
  response_col: prediction
  fallback_col: detailed_prediction
  max_fails: 50
evaluation:
  launch_mode: fg
  nproc: 4
  judge: gpt-4o-mini
  openai_api_base: https://api.openai.com/v1
worker_monitor:
  enable: true
  interval_seconds: 300
resume_infer_default: false
resume_infer_start_delay_seconds: 10
